[project]
name = "apuramandato"
version = "0.1.0"
description = "Agente de apuração de mandatos, emendas e dados eleitorais com LangChain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Igor Laltuf" }]
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "langchain-community>=0.4,<1",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.2,<2",
    "langsmith>=0.14,<1",
    "faiss-cpu>=1.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pandas>=2.2",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["notebooks", "entregaveis/historico"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# ISC001: strings concatenadas implicitamente em prompts são intencionais
ignore = ["ISC001", "ISC004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
